[project]
name = "brand-os"
version = "0.1.0"
description = "Spec-driven content generation mono-repo"
requires-python = ">=3.11"
authors = [ { name = "brand-os" } ]

dependencies = [
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "openai>=0.27.0",
  "rich>=13.0",
]

[project.scripts]
brand-generate = "generation.engine.main:cli"

[tool.uv]
managed = true
